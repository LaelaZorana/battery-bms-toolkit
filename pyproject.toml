[project]
name = "battery-bms-toolkit"
version = "0.1.0"
description = "Li-ion equivalent circuit models and BMS algorithms (EKF/UKF SOC, SOH RLS, HPPC fitting, balancing, thermal, safety)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pandas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
